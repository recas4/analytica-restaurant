# =============================================================================
# GitLab CI/CD Pipeline - Analytica Restaurant
# Build: Alle Services + Frontend | Test: Auth + Payment | Push: Harbor Registry
# =============================================================================

stages:
  - prepare
  - build
  - test
  - push

# =============================================================================
# Global Variables & Cache
# =============================================================================
variables:
  GOPROXY: "https://proxy.golang.org,direct"
  GOFLAGS: "-mod=readonly"
  CGO_ENABLED: "0"
  # Harbor Registry (Values from GitLab CI/CD Variables)
  # HARBOR_URL: https://case-projects.rz.fh-ingolstadt.de
  # HARBOR_PROJECT: cnd-qeb2708
  # HARBOR_ROBOT_NAME: (set in GitLab)
  # HARBOR_ROBOT_TOKEN: (set in GitLab)
  # HARBOR_IMAGE_PREFIX: case-projects.rz.fh-ingolstadt.de/cnd-qeb2708

# Global cache for Go modules
.go_cache: &go_cache
  key: ${CI_COMMIT_REF_SLUG}-go-modules
  paths:
    - .go/pkg/mod/
  policy: pull-push

# =============================================================================
# Templates
# =============================================================================

.go_template: &go_template
  image: golang:1.24-alpine
  before_script:
    - apk add --no-cache git
    - mkdir -p .go
    - export GOPATH="$CI_PROJECT_DIR/.go"
    - export PATH="$GOPATH/bin:$PATH"

prepare:dependencies:
  stage: prepare
  <<: *go_template
  cache:
    key: ${CI_COMMIT_REF_SLUG}-go-deps
    paths:
      - .go/pkg/mod/
    policy: pull-push
  script:
    - cd auth-service && go mod download && cd ..
    - cd payment-service && go mod download && cd ..
    - cd shopping-service && go mod download && cd ..
    - cd checkout-service && go mod download && cd ..
    - cd kitchen-service && go mod download && cd ..
    - cd delivery-service && go mod download && cd ..
  rules:
    - changes:
        - "**/go.mod"
        - "**/go.sum"
        - auth-service/**/*
        - payment-service/**/*
        - shopping-service/**/*
        - checkout-service/**/*
        - kitchen-service/**/*
        - delivery-service/**/*

# =============================================================================
# BUILD STAGE - All Services
# =============================================================================

build:auth-service:
  stage: build
  <<: *go_template
  needs:
    - job: prepare:dependencies
      optional: true
  cache:
    key: ${CI_COMMIT_REF_SLUG}-go-deps
    paths:
      - .go/pkg/mod/
    policy: pull
  script:
    - cd auth-service
    - go build -ldflags="-s -w" -o bin/auth-service ./cmd/main.go
  artifacts:
    paths:
      - auth-service/bin/
    expire_in: 1 hour
  rules:
    - changes:
        - auth-service/**/*

build:payment-service:
  stage: build
  <<: *go_template
  needs:
    - job: prepare:dependencies
      optional: true
  cache:
    key: ${CI_COMMIT_REF_SLUG}-go-deps
    paths:
      - .go/pkg/mod/
    policy: pull
  script:
    - cd payment-service
    - go build -ldflags="-s -w" -o bin/payment-service ./src/main.go
  artifacts:
    paths:
      - payment-service/bin/
    expire_in: 1 hour
  rules:
    - changes:
        - payment-service/**/*

build:shopping-service:
  stage: build
