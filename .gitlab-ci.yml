    key: ${CI_COMMIT_REF_SLUG}-go-deps
    paths:
      - .go/pkg/mod/
    policy: pull
  script:
    - cd checkout-service
    - go build -ldflags="-s -w" -o bin/checkout-service ./cmd/main.go
  artifacts:
    paths:
      - checkout-service/bin/
    expire_in: 1 hour
  rules:
    - changes:
        - checkout-service/**/*

build:kitchen-service:
  stage: build
  <<: *go_template
  needs:
    - job: prepare:dependencies
      optional: true
  cache:
    key: ${CI_COMMIT_REF_SLUG}-go-deps
    paths:
      - .go/pkg/mod/
    policy: pull
  script:
    - cd kitchen-service
    - go build -ldflags="-s -w" -o bin/kitchen-service ./src/main.go
  artifacts:
    paths:
      - kitchen-service/bin/
    expire_in: 1 hour
  rules:
    - changes:
        - kitchen-service/**/*

build:delivery-service:
  stage: build
  <<: *go_template
  needs:
    - job: prepare:dependencies
      optional: true
  cache:
    key: ${CI_COMMIT_REF_SLUG}-go-deps
    paths:
      - .go/pkg/mod/
    policy: pull
  script:
    - cd delivery-service
    - go build -ldflags="-s -w" -o bin/delivery-service ./src/main.go
  artifacts:
    paths:
      - delivery-service/bin/
    expire_in: 1 hour
  rules:
    - changes:
        - delivery-service/**/*

build:frontend:
  stage: build
  image: node:20-alpine
  cache:
    key: ${CI_COMMIT_REF_SLUG}-npm
    paths:
      - frontend/node_modules/
    policy: pull-push
  script:
    - cd frontend
    - npm ci
    - npm run build
  artifacts:
    paths:
      - frontend/dist/
    expire_in: 1 hour
  rules:
    - changes:
        - frontend/**/*

# =============================================================================
# TEST STAGE
# =============================================================================

test:auth-service:
  stage: test
  <<: *go_template
  cache:
    key: ${CI_COMMIT_REF_SLUG}-go-deps
    paths:
      - .go/pkg/mod/
    policy: pull
  needs:
    - job: build:auth-service
      optional: true
  script:
    - cd auth-service
    - go test -v -coverprofile=coverage.out -covermode=atomic ./...
    - go tool cover -func=coverage.out | tail -1
  coverage: '/total:\s+\(statements\)\s+(\d+\.\d+)%/'
  artifacts:
    paths:
      - auth-service/coverage.out
    expire_in: 1 week
  rules:
    - changes:
        - auth-service/**/*

test:payment-service:
  stage: test
  <<: *go_template
  cache:
    key: ${CI_COMMIT_REF_SLUG}-go-deps
    paths:
      - .go/pkg/mod/
    policy: pull
  needs:
    - job: build:payment-service
      optional: true
  script:
    - cd payment-service
    - go test -v -coverprofile=coverage.out -covermode=atomic ./...
    - go tool cover -func=coverage.out | tail -1
  coverage: '/total:\s+\(statements\)\s+(\d+\.\d+)%/'
  artifacts:
    paths:
      - payment-service/coverage.out
    expire_in: 1 week
  rules:
    - changes:
        - payment-service/**/*

# =============================================================================
# PUSH STAGE - Harbor Registry


.docker_template: &docker_template
  image: docker:24-cli
  services:
    - docker:24-dind
  variables:
    DOCKER_TLS_CERTDIR: "/certs"
  before_script:
    - echo "$HARBOR_ROBOT_TOKEN" | docker login $HARBOR_URL -u $HARBOR_ROBOT_NAME --password-stdin

push:auth-service:
  stage: push
  <<: *docker_template
  needs:
    - job: build:auth-service
      optional: true
    - job: test:auth-service
      optional: true
  script:
    - docker pull $HARBOR_IMAGE_PREFIX/auth-service:latest || true
    - |
      docker build \
        --cache-from $HARBOR_IMAGE_PREFIX/auth-service:latest \
        --build-arg BUILDKIT_INLINE_CACHE=1 \
        -t $HARBOR_IMAGE_PREFIX/auth-service:$CI_COMMIT_SHORT_SHA \
        -t $HARBOR_IMAGE_PREFIX/auth-service:latest \
        ./auth-service
    - docker push $HARBOR_IMAGE_PREFIX/auth-service:$CI_COMMIT_SHORT_SHA
    - docker push $HARBOR_IMAGE_PREFIX/auth-service:latest
  rules:
    - if: $CI_COMMIT_BRANCH
      changes:
        - auth-service/**/*

