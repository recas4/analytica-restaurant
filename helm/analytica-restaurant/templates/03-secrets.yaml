{{- /* Secrets for sensitive data */}}
{{- if .Values.authService.enabled }}
apiVersion: v1
kind: Secret
metadata:
  name: auth-service-secret
  namespace: {{ .Release.Namespace }}
  labels:
    app: auth-service
type: Opaque
stringData:
  JWT_SECRET: {{ .Values.authService.jwt.secret }}
{{- end }}
