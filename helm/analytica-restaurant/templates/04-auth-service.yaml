{{- if .Values.authService.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: auth-service-config
  namespace: {{ .Release.Namespace }}
  labels:
    app: auth-service
data:
  PORT: "{{ .Values.authService.port }}"
  JWT_EXPIRY: "{{ .Values.authService.jwt.expirySeconds }}"
  MONGO_URI: "{{ .Values.authService.mongodb.uri }}"
  MONGO_DB: "auth_db"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: auth-service
  namespace: {{ .Release.Namespace }}
spec:
  replicas: {{ .Values.authService.replicas }}
  selector:
    matchLabels:
      app: auth-service
  template:
    metadata:
      labels:
        app: auth-service
    spec:
      imagePullSecrets:
        - name: harbor-secret
      containers:
        - name: auth-service
          image: "{{ .Values.global.registry }}/{{ .Values.authService.image.repository }}:{{ .Values.authService.image.tag }}"
          imagePullPolicy: {{ .Values.global.imagePullPolicy }}
          ports:
            - containerPort: {{ .Values.authService.port }}
              name: http
          envFrom:
            - configMapRef:
                name: auth-service-config
            - secretRef:
                name: auth-service-secret
          livenessProbe:
            httpGet:
              path: /health
              port: {{ .Values.authService.port }}
            initialDelaySeconds: 30
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /health
              port: {{ .Values.authService.port }}
            initialDelaySeconds: 10
            periodSeconds: 5
          resources:
            requests:
              memory: {{ .Values.authService.resources.requests.memory }}
              cpu: {{ .Values.authService.resources.requests.cpu }}
            limits:
              memory: {{ .Values.authService.resources.limits.memory }}
              cpu: {{ .Values.authService.resources.limits.cpu }}
---
apiVersion: v1
kind: Service
metadata:
  name: auth-service
  namespace: {{ .Release.Namespace }}
spec:
  selector:
    app: auth-service
  ports:
    - port: {{ .Values.authService.port }}
      targetPort: {{ .Values.authService.port }}
      name: http
  type: ClusterIP
{{- end }}
